<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feed Customizer</title>
  </head>
  <body>
    <header>
      <h1>Feed Customizer</h1>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="track"><span class="knob"></span></span>
      </label>
    </header>

    <div class="notice" id="no-key">
      This needs a TypeSafe API key before it can judge anything.
      <button id="open-options" type="button">Add a key</button>
    </div>

    <label class="field-label" for="rule">What do you want on your feed?</label>
    <textarea
      id="rule"
      rows="5"
      spellcheck="false"
      placeholder="No reaction videos or drama commentary. More long-form stuff about programming and music theory."
    ></textarea>

    <div class="row">
      <button id="save" type="button">Save</button>
      <span id="status" class="status" aria-live="polite"></span>
      <span id="hidden-count" class="count"></span>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
